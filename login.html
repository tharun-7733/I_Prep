<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Login — iPrep</title>
  <meta name="description" content="Login or sign up to iPrep — AI-powered interview preparation platform."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="shared.css"/><link rel="stylesheet" href="login.css"/>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
  <div class="login-layout">
    <!-- LEFT: Branding Panel -->
    <div class="brand-panel">
      <canvas id="brandCanvas" class="brand-canvas"></canvas>
      <div class="brand-content">
        <a href="index.html" class="brand-logo">&lt;iPrep /&gt;</a>
        <h2 class="brand-tagline">Practice.<br/>Evaluate.<br/><span class="gradient-text">Improve.</span></h2>
        <p class="brand-sub">Join 2,400+ engineers sharpening their skills with AI-powered interview prep.</p>

        <!-- Fake terminal -->
        <div class="terminal-card">
          <div class="term-bar">
            <span class="term-dot red"></span><span class="term-dot yellow"></span><span class="term-dot green"></span>
            <span class="term-title">i_prep ~ session</span>
          </div>
          <div class="term-body" id="termBody">
            <div class="term-line"><span class="term-prompt">$</span> <span class="term-cmd">iprep start --role backend --difficulty medium</span></div>
            <div class="term-out" id="termOut"></div>
          </div>
        </div>

        <div class="brand-stats">
          <div class="bs-item"><div class="bs-val">10K+</div><div class="bs-label">Questions</div></div>
          <div class="bs-sep"></div>
          <div class="bs-item"><div class="bs-val">50+</div><div class="bs-label">Tech Roles</div></div>
          <div class="bs-sep"></div>
          <div class="bs-item"><div class="bs-val">AI</div><div class="bs-label">Feedback</div></div>
        </div>
      </div>
    </div>

    <!-- RIGHT: Auth Panel -->
    <div class="auth-panel">
      <div class="auth-card glass-card" id="authCard">
        <!-- Tab Toggle -->
        <div class="auth-tabs">
          <button class="auth-tab active" id="tabLogin" data-mode="login">Login</button>
          <button class="auth-tab" id="tabSignup" data-mode="signup">Sign Up</button>
        </div>

        <!-- Login Form -->
        <form class="auth-form" id="loginForm" novalidate>
          <div class="form-group">
            <label class="form-label">Email</label>
            <input class="form-input auth-input" id="loginEmail" type="email" placeholder="you@example.com" autocomplete="email"/>
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <div class="pw-wrap">
              <input class="form-input auth-input" id="loginPw" type="password" placeholder="••••••••" autocomplete="current-password"/>
              <button type="button" class="pw-toggle" id="toggleLoginPw"><i class="ph ph-eye"></i></button>
            </div>
            <a href="#" class="forgot-link">Forgot password?</a>
          </div>
          <button type="submit" class="btn-primary btn-auth" id="btnLogin">
            <span class="auth-spinner" id="loginSpinner" style="display:none">⟳</span>
            <span id="loginLabel">Login</span>
            <span class="btn-shimmer"></span>
          </button>
        </form>

        <!-- Signup Form (hidden) -->
        <form class="auth-form" id="signupForm" novalidate style="display:none">
          <div class="form-row-2">
            <div class="form-group"><label class="form-label">Full Name</label><input class="form-input auth-input" id="signupName" type="text" placeholder="Tharun Tej"/></div>
            <div class="form-group"><label class="form-label">Email</label><input class="form-input auth-input" id="signupEmail" type="email" placeholder="you@example.com"/></div>
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <div class="pw-wrap">
              <input class="form-input auth-input" id="signupPw" type="password" placeholder="Min. 8 characters"/>
              <button type="button" class="pw-toggle" id="toggleSignupPw"><i class="ph ph-eye"></i></button>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Confirm Password</label>
            <input class="form-input auth-input" id="signupPw2" type="password" placeholder="Repeat password"/>
          </div>
          <div class="form-group">
            <label class="form-label">Preferred Role</label>
            <select class="form-select" id="signupRole">
              <option value="">Select a role…</option>
              <option value="backend">Backend Engineer</option>
              <option value="frontend">Frontend Developer</option>
              <option value="fullstack">Full Stack Developer</option>
              <option value="devops">DevOps Engineer</option>
              <option value="system">System Designer</option>
              <option value="dsa">DSA / Competitive Programming</option>
            </select>
          </div>
          <button type="submit" class="btn-primary btn-auth" id="btnSignup">
            <span class="auth-spinner" id="signupSpinner" style="display:none">⟳</span>
            <span id="signupLabel">Create Account</span>
            <span class="btn-shimmer"></span>
          </button>
        </form>



        <p class="auth-switch" id="authSwitch">
          Don't have an account? <button class="switch-link" id="switchToSignup">Sign up free</button>
        </p>
      </div>
    </div>
  </div>

  <!-- Load Supabase FIRST so it is available to all other scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="login.js"></script>
  <script src="auth.js"></script>
</body>
</html>
